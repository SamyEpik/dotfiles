  name = floating-bitwarden-extension
  match:title = ^(Extension: (Bitwarden Password Manager) - Bitwarden — Mozilla Firefox)$
  float = on
  center = on
  size = 860 645
}

# sets programs with --class floating to floating
windowrule {
  name = float-class-floating
  match:class = floating
  float = on
  size = 860 645
  center = on
}
