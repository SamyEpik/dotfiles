# Colors generated from pywal (template: wal/.config/wal/templates/colors-hyprtoolkit.conf)
source = $HOME/.cache/wal/colors-hyprtoolkit.conf

# Rounding (matches decoration:rounding = 10)
rounding_large = 10
rounding_small = 5

# Font sizes
h1_size         = 19
h2_size         = 15
h3_size         = 13
font_size       = 11
small_font_size = 10

# Fonts / icons
font_family           = JetBrainsMono Nerd Font
font_family_monospace = JetBrainsMono Nerd Font Mono
icon_theme            = Papirus-Dark
